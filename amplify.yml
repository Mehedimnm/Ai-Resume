version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        # Amplify Console env vars are available during build but NOT to the
        # Next.js SSR runtime by default. Write the server-side vars into
        # .env.production so they are bundled and available at runtime.
        - env | grep -E '^(MONGODB_URI|MONGODB_DB|AUTH_SECRET|GEMINI_API_KEY|GEMINI_MODEL|GEMINI_FALLBACK_MODELS|NEXT_PUBLIC_SITE_URL)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
